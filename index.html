<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financier · V1.5</title>
<style>
:root{font-family:Arial,sans-serif;color:#17263c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:260px;background:#17263c;color:white;padding:22px;flex-shrink:0}aside h1{margin:0 0 30px;font-size:25px}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#e2e8f0;padding:13px;border-radius:8px;cursor:pointer;font-size:15px}nav button:hover,nav button.active{background:#30435d}main{flex:1;padding:32px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 10px #15223a0d;margin-top:20px}.muted{color:#697789}button{cursor:pointer}.primary{background:#2563eb;border:0;color:white;padding:11px 16px;border-radius:8px;font-weight:bold}.secondary{background:#edf2f8;border:0;color:#17263c;padding:8px 12px;border-radius:7px}.danger{background:#fff0f0;color:#b42318;border:0;padding:8px 12px;border-radius:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #e9edf3}.item:last-child{border-bottom:0}.item-name{background:none;border:0;color:#1d4ed8;text-align:left;font-size:16px;font-weight:600;padding:5px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.breadcrumb{font-size:14px;color:#64748b;margin:12px 0}.breadcrumb button{border:0;background:none;color:#2563eb;cursor:pointer;padding:0 4px}#mobileToggle{display:none}dialog{border:0;border-radius:12px;padding:24px;max-width:calc(100vw - 32px);width:420px;box-shadow:0 15px 60px #0003}dialog::backdrop{background:#0006}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:12px 0 20px;font-size:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}@media(max-width:700px){.app{display:block}aside{width:100%;padding:14px 18px}aside h1{margin:0;font-size:22px}#mobileToggle{display:inline-block;float:right;background:#30435d;border:0;border-radius:7px;color:white;padding:7px 12px}nav{display:none;margin-top:15px}nav.open{display:block}main{padding:18px}.card{padding:16px}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside>
<button id="mobileToggle" aria-expanded="false" aria-controls="nav">☰ Menú</button>
<h1>Financier</h1>
<nav id="nav">
<button class="active" data-page="home">⌂ Resumen general</button>
<button data-page="types">▤ Tipos de inversión</button>
</nav>
</aside>
<main>
<div class="top"><div><h2 id="heading">Resumen general</h2><p class="muted" id="subtitle">Organiza tus inversiones en tres niveles.</p></div><button class="primary" id="addButton">+ Nuevo tipo</button></div>
<div class="breadcrumb" id="breadcrumb"></div>
<section class="card" id="content" aria-live="polite"></section>
</main>
</div>
<dialog id="editor"><form id="editorForm"><h3 id="dialogTitle">Nuevo elemento</h3><label for="itemName">Nombre</label><input id="itemName" required maxlength="80" autocomplete="off"><div class="dialog-actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog>
<script>
'use strict';
// V1.5: datos temporales de demostración. No se guardan ni se sincronizan.
let types=[];
let selectedType=null,selectedPlatform=null,editTarget=null;
const $=id=>document.getElementById(id);
const makeItem=name=>({id:crypto.randomUUID(),name,children:[]});
const currentType=()=>types.find(x=>x.id===selectedType);
const currentPlatform=()=>currentType()?.children.find(x=>x.id===selectedPlatform);
const collection=()=>selectedPlatform?currentPlatform()?.children:selectedType?currentType()?.children:types;
const level=()=>selectedPlatform?'Producto':selectedType?'Plataforma':'Tipo de inversión';
function button(label,cls,action){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',action);return b}
function show(page){if(page==='home'){selectedType=null;selectedPlatform=null}else if(page==='types'){selectedType=null;selectedPlatform=null}render()}
function render(){
const isProduct=Boolean(selectedPlatform),isPlatform=Boolean(selectedType)&&!isProduct;
$('heading').textContent=isProduct?currentPlatform()?.name||'Productos':isPlatform?currentType()?.name||'Plataformas':'Mis inversiones';
$('subtitle').textContent=isProduct?'Productos de esta plataforma':isPlatform?'Plataformas de este tipo':'Tipos de inversión registrados';
$('addButton').textContent='+ Añadir '+level().toLowerCase();
const crumbs=$('breadcrumb');crumbs.replaceChildren();crumbs.append(button('Inversiones','',()=>show('types')));
if(selectedType){crumbs.append(' / ');crumbs.append(button(currentType()?.name||'','',()=>{selectedPlatform=null;render()}))}
if(selectedPlatform)crumbs.append(' / '+(currentPlatform()?.name||''));
const area=$('content');area.replaceChildren();const data=collection()||[];
if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='Todavía no hay elementos. Pulsa «'+$('addButton').textContent+'» para empezar.';area.append(p)}
for(const entry of data){const row=document.createElement('div');row.className='item';const actions=document.createElement('div');actions.className='actions';
const name=button(entry.name+'  ›','item-name',()=>{if(isProduct)return;if(isPlatform)selectedPlatform=entry.id;else selectedType=entry.id;render()});
if(isProduct){name.textContent=entry.name;name.disabled=true;name.style.color='#17263c'}
actions.append(button('Editar','secondary',()=>openEditor(entry)),button('Eliminar','danger',()=>removeItem(entry)));
row.append(name,actions);area.append(row)}
}
function openEditor(entry=null){editTarget=entry;$('dialogTitle').textContent=(entry?'Editar ':'Añadir ')+level().toLowerCase();$('itemName').value=entry?.name||'';$('editor').showModal();$('itemName').focus()}
function removeItem(entry){const data=collection();if(!data)return;const warning=entry.children?.length?' También se eliminarán todos los elementos que contiene.':'';if(!confirm('¿Eliminar «'+entry.name+'»?'+warning))return;const idx=data.findIndex(x=>x.id===entry.id);if(idx>=0)data.splice(idx,1);render()}
$('editorForm').addEventListener('submit',e=>{e.preventDefault();const name=$('itemName').value.trim();if(!name)return;const data=collection();if(!data)return;if(editTarget)editTarget.name=name;else data.push(makeItem(name));$('editor').close();render()});
$('addButton').addEventListener('click',()=>openEditor());$('cancel').addEventListener('click',()=>$('editor').close());
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;show(b.dataset.page);$('nav').classList.remove('open');$('mobileToggle').setAttribute('aria-expanded','false')});
$('mobileToggle').addEventListener('click',()=>{const opened=$('nav').classList.toggle('open');$('mobileToggle').setAttribute('aria-expanded',String(opened))});
render();
</script>
</body>
</html>
